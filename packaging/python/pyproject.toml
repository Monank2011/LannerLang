[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lannerlang-installer"
version = "3.0.0"
description = "Installer for the LannerLang programming language compiler"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Monank Gohil"}]
license = {text = "Apache-2.0"}

[project.scripts]
lanner-install = "lanner_installer:main"

[tool.setuptools]
py-modules = ["lanner_installer"]
